services:
  - type: web
    name: quickloan-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from app import init_db; init_db()" && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
